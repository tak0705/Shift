<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>シフト希望入力</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #3f51b5;
      --accent-color: #f50057;
      --background: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #333;
      --gray: #ccc;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 30px;
      font-size: 20px;
      color: var(--text-color);
    }

    .container {
      background-color: var(--card-bg);
      max-width: 800px;
      margin: auto;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 36px;
      text-align: center;
      color: var(--main-color);
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .input-group label {
      font-weight: 700;
    }

    .input-group select,
    .input-group input,
    .input-group button {
      padding: 14px 18px;
      font-size: 20px;
      border: 1px solid var(--gray);
      border-radius: 8px;
      transition: 0.3s;
    }

    .input-group button,
    #submitBtn,
    #copyBtn {
      background-color: var(--main-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .input-group button:hover,
    #submitBtn:hover,
    #copyBtn:hover {
      background-color: #2c3ca5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      table-layout: fixed;
      font-size: 24px;
    }

    th, td {
      padding: 20px;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 24px;
    }

    th {
      background-color: #e3eaf4;
    }

    .holiday, .sun {
      color: var(--accent-color);
      font-weight: bold;
    }

    .sat {
      color: #2196f3;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      background-color: #fafafa;
      margin-bottom: 10px;
    }

    button {
      padding: 14px 20px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }

      h1 {
        font-size: 28px;
      }

      th, td {
        font-size: 22px;
        padding: 14px;
      }

      textarea {
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>シフト希望入力</h1>
    <div class="input-group">
      <label for="monthPicker">年月:</label>
      <input type="month" id="monthPicker">
      <button id="generateBtn">生成</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>月日</th>
          <th>曜日</th>
          <th>シフト希望</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <button id="submitBtn">メッセージ作成</button>
    <textarea id="resultText" readonly></textarea>
    <button id="copyBtn">コピー</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const monthPicker = document.getElementById("monthPicker");
      const tableBody = document.getElementById("tableBody");
      const resultText = document.getElementById("resultText");
      const copyBtn = document.getElementById("copyBtn");

      const holidaysJP = {
        "2025-01-01": "元日",
        "2025-01-13": "成人の日",
        "2025-02-11": "建国記念の日",
        "2025-03-20": "春分の日",
        "2025-04-29": "昭和の日",
        "2025-05-03": "憲法記念日",
        "2025-05-04": "みどりの日",
        "2025-05-05": "こどもの日",
        "2025-05-06": "憲法記念日 振替休日",
        "2025-07-21": "海の日",
        "2025-08-11": "山の日",
        "2025-09-15": "敬老の日",
        "2025-09-23": "秋分の日",
        "2025-10-13": "スポーツの日",
        "2025-11-03": "文化の日",
        "2025-11-23": "勤労感謝の日",
        "2025-11-24": "勤労感謝の日 振替休日"
      };

      const today = new Date();
      const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1);
      monthPicker.value = `${nextMonth.getFullYear()}-${String(nextMonth.getMonth() + 1).padStart(2, '0')}`;

      generateShiftTable(nextMonth.getFullYear(), nextMonth.getMonth() + 1);

      function getDayOfWeek(year, month, day) {
        return ["日", "月", "火", "水", "木", "金", "土"][new Date(year, month - 1, day).getDay()];
      }

      function isHoliday(year, month, day) {
        const key = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        return holidaysJP[key];
      }

      function generateShiftTable(year, month) {
        tableBody.innerHTML = "";
        const daysInMonth = new Date(year, month, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const dayName = getDayOfWeek(year, month, day);
          const holidayName = isHoliday(year, month, day);

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${month}-${day}</td>
            <td class="${holidayName ? 'holiday' : dayName === '日' ? 'sun' : dayName === '土' ? 'sat' : ''}">${dayName}</td>
            <td>
              <select aria-label="シフト希望選択 ${month}-${day}">
                <option value="〇">〇</option>
                <option value="×" selected>×</option>
              </select>
            </td>
          `;
          tableBody.appendChild(row);
        }
      }

      document.getElementById("generateBtn").addEventListener("click", () => {
        const [year, month] = monthPicker.value.split("-").map(Number);
        generateShiftTable(year, month);
      });

      document.getElementById("submitBtn").addEventListener("click", () => {
        const rows = tableBody.querySelectorAll("tr");
        const [year, month] = monthPicker.value.split("-").map(Number);
        const result = Array.from(rows).map(row => {
          const date = row.children[0].textContent;
          const dow = row.children[1].textContent;
          const val = row.children[2].querySelector("select").value;
          return `${date} (${dow}): ${val}`;
        });
        resultText.value = `お疲れ様です。\n${month}月の出勤希望日になります。\nよろしくお願いいたします。\n〇：出勤希望日\n\n${result.join("\n")}`;
      });

      copyBtn.addEventListener("click", () => {
        resultText.select();
        document.execCommand("copy");
      });
    });
  </script>
</body>
</html>
